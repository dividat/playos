name: "Prepare nix build environment"

inputs:
  NIX_CACHE_ACCOUNT_ID:
    description: S3 (cloudflare) account ID
    required: false

  NIX_CACHE_ACCESS_KEY_ID:
    description: S3 bucket access key ID
    required: false

  NIX_CACHE_SECRET_ACCESS_KEY:
    description: S3 bucket secret access key
    required: false

  NIX_BINARY_CACHE_PRIVATE_KEY:
    description: private key used for signing store paths for the nix cache
    required: false

  # these are not intended to be configurable, but there's simply no way
  # to have constants/envs in a composite action
  NIX_CACHE_S3_BUCKET:
    default: dividat-ci-nix-cache

  NIX_CACHE_S3_PROFILE:
    default: nixcache

  NIX_CACHE_S3_REGION:
    default: weur

  NIX_STORE_PUBLIC_KEY:
    default: "dividat-ci-nix-cache-1:vhWwMmDRyiG7ICbeWWpC03k1XsRs2fIQB461il3EL3U="

  NIX_STORE_PRIVATE_KEY_FILE:
    default: "/etc/nix/key.private"
runs:
  using: "composite"
  steps:
  - name: Ensure KVM is usable by nix-build
    run: sudo chmod a+rwx /dev/kvm
    shell: bash

  - name: Remove unused libraries for more available disk space
    run: |
        df -h
        sudo rm -rf /usr/share/dotnet         # .NET SDKs
        sudo rm -rf /usr/local/lib/android    # Android SDK
        sudo rm -rf /opt/hostedtoolcache      # Hosted tool cache (CodeQL, etc.)
        sudo rm -rf /usr/lib/jvm              # Java/JDK installations
        sudo docker system prune --all --force
        df -h
    shell: bash

  - name: Install task-spooler
    run: |
      sudo apt-get update
      sudo apt-get install -y task-spooler
    shell: bash

  - name: Write private key to file
    shell: bash
    if: ${{ inputs.NIX_BINARY_CACHE_PRIVATE_KEY }}
    run: |
      sudo mkdir -p $(dirname "${INPUTS_NIX_STORE_PRIVATE_KEY_FILE}")
      echo -n "${INPUTS_NIX_BINARY_CACHE_PRIVATE_KEY}" | sudo tee "${INPUTS_NIX_STORE_PRIVATE_KEY_FILE}"
    env:
      INPUTS_NIX_STORE_PRIVATE_KEY_FILE: ${{ inputs.NIX_STORE_PRIVATE_KEY_FILE }}
      INPUTS_NIX_BINARY_CACHE_PRIVATE_KEY: ${{ inputs.NIX_BINARY_CACHE_PRIVATE_KEY }}

  - name: Create AWS credentials and config for profile
    shell: bash
    if: ${{ inputs.NIX_CACHE_ACCESS_KEY_ID && inputs.NIX_CACHE_SECRET_ACCESS_KEY }}
    run: |
      sudo -i aws configure set endpoint_url https://${INPUTS_NIX_CACHE_ACCOUNT_ID}.r2.cloudflarestorage.com/ --profile ${INPUTS_NIX_CACHE_S3_PROFILE}
      sudo -i aws configure set aws_access_key_id ${INPUTS_NIX_CACHE_ACCESS_KEY_ID} --profile ${INPUTS_NIX_CACHE_S3_PROFILE}
      sudo -i aws configure set aws_secret_access_key ${INPUTS_NIX_CACHE_SECRET_ACCESS_KEY} --profile ${INPUTS_NIX_CACHE_S3_PROFILE}
      sudo -i aws configure set region ${INPUTS_NIX_CACHE_S3_REGION} --profile ${INPUTS_NIX_CACHE_S3_PROFILE}
      # Allow any user to access the AWS credentials and provide it both for
      # current user and root, since it's tricky to ensure different nix
      # commands (nix-build, nix copy) read from the right locations, see:
      # https://github.com/NixOS/nix/issues/2161
      sudo chmod -R a+rx /root/.aws
      sudo chmod a+rx /root/
      cp -r /root/.aws ~/.aws
    env:
      INPUTS_NIX_CACHE_ACCOUNT_ID: ${{ inputs.NIX_CACHE_ACCOUNT_ID }}
      INPUTS_NIX_CACHE_S3_PROFILE: ${{ inputs.NIX_CACHE_S3_PROFILE}}
      INPUTS_NIX_CACHE_ACCESS_KEY_ID: ${{ inputs.NIX_CACHE_ACCESS_KEY_ID }}
      INPUTS_NIX_CACHE_SECRET_ACCESS_KEY: ${{ inputs.NIX_CACHE_SECRET_ACCESS_KEY }}
      INPUTS_NIX_CACHE_S3_REGION: ${{ inputs.NIX_CACHE_S3_REGION }}

  - name: Install post-run action
    uses: yfyf/run-and-post-run@d4c684a8c8f09138bed7a27adbf1a7f8dae845bf # main, 2025-07-23
    with:
      post: |
        echo "Waiting for cache uploads to finish"
        sudo -i tsp -w || true
        sudo -i tsp -l

  - uses: cachix/install-nix-action@0b0e072294b088b73964f1d72dfdac0951439dbd # v31.8.4
    with:
      nix_path: nixpkgs=channel:nixos-unstable
      extra_nix_config: |
        system-features = nixos-test benchmark big-parallel kvm
        substituters = https://cache.nixos.org/ https://nix-cache.dividump.xyz/
        trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ inputs.NIX_STORE_PUBLIC_KEY }}
        ${{ inputs.NIX_CACHE_SECRET_ACCESS_KEY && format('post-build-hook = {0}/.github/workflows/upload-to-s3-cache.sh', github.workspace) || '' }}
        ${{ inputs.NIX_BINARY_CACHE_PRIVATE_KEY && format('secret-key-files = {0}', inputs.NIX_STORE_PRIVATE_KEY_FILE) || '' }}
